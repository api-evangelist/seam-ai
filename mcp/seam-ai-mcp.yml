description: 'Seam AI runs a remote, anonymous Model Context Protocol server on its documentation host.
  It is a documentation-search server (the Mintlify docs MCP surface), not a server over the Seam product
  API: the tools search and read the public docs corpus and file feedback, and the server''s own instructions
  tell a client not to claim access to private or authenticated content. The server was probed live —
  initialize and tools/list both returned 200 without credentials — and the verbatim tools/list response
  is saved to seam-ai-mcp-tools.json. A /.well-known/mcp.json descriptor on the same host names the underlying
  Mintlify origin (https://signal-97.main-kill-isr.mintlify.me/mcp) as an equivalent endpoint with authentication
  "none".'
