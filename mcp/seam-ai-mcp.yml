generated: '2026-08-13'
method: probed
status: published
source: https://docs.getseam.ai/mcp
description: >-
  Seam AI runs a remote, anonymous Model Context Protocol server on its
  documentation host. It is a documentation-search server (the Mintlify docs MCP
  surface), not a server over the Seam product API: the tools search and read the
  public docs corpus and file feedback, and the server's own instructions tell a
  client not to claim access to private or authenticated content. The server was
  probed live — initialize and tools/list both returned 200 without credentials —
  and the verbatim tools/list response is saved to seam-ai-mcp-tools.json.
  A /.well-known/mcp.json descriptor on the same host names the underlying
  Mintlify origin (https://signal-97.main-kill-isr.mintlify.me/mcp) as an
  equivalent endpoint with authentication "none".
deployment:
  mode: remote
  endpoint: https://docs.getseam.ai/mcp
  auth: none
  verified: probed
server:
  name: Seam AI
  version: 1.0.0
  transport: http
  protocol_version: '2025-06-18'
  url: https://docs.getseam.ai/mcp
  alternate_url: https://signal-97.main-kill-isr.mintlify.me/mcp
  descriptor: well-known/seam-ai-mcp.json
  capabilities:
    tools:
      list_changed: true
    resources:
      list_changed: true
  instructions: >-
    Provides search and retrieval tools for the Seam AI site; answers questions
    from public site content and exposes resources containing additional skill
    guidance.
tools:
- name: search_seam_ai
  description: >-
    Search across the Seam AI knowledge base to find relevant information, code
    examples, API references, and guidance.
  input: [query]
- name: query_docs_filesystem_seam_ai
  description: >-
    Run a read-only shell-like query against a virtualized, in-memory filesystem
    containing the documentation corpus.
  input: [command]
- name: submit_feedback
  description: >-
    Report a problem with this documentation site so the docs team can fix it.
  input: [path, feedback]
resources:
- uri: mintlify://skills/signal
  name: signal
  note: The Signal Agent Skill, also served at /.well-known/agent-skills/signal/skill.md
tool_count: 3
files:
  tools_list: seam-ai-mcp-tools.json
