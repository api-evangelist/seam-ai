description: >-
  Cross-cutting standards and compliance posture for Seam AI. The agent-facing
  standards (MCP, A2A, llms.txt, Agent Skills) are the strong side of this
  profile — all four are served live from docs.getseam.ai. The HTTP-API
  standards side is thin: API-key auth only, no OAuth, no OIDC, no RFC 9457.
