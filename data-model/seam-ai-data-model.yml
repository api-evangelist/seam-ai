    is visible; no schema is asserted for any of them.
  entities:
  - {name: Account, description: A target company in the unified data model.}
  - {name: Contact, description: A person at an account, prospected and enriched by Seam.}
  - {name: FitScore, description: AI-generated ICP match grade (A/B/C/D) on an account.}
  - {name: Intent, description: First- and third-party engagement signal on an account.}
  - {name: Signal, description: An external event trigger — new hires, funding, job posts, social mentions.}
  - {name: Persona, description: A target role definition used to select contacts within an account.}
  - {name: Audience, description: A dynamic segment combining fit, intent, signals and attributes.}
  - {name: Play, description: An automated workflow — trigger, audience filter, personas, enrichment, routing, deployment.}
  - {name: RoutingQueue, description: A reusable group of sales reps for contact distribution.}
  - {name: Connection, description: A configured source/destination system (Salesforce, HubSpot, Snowflake, ...).}
  product_relationships:
