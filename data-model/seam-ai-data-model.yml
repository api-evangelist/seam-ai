  - {from: Audience, to: Account, type: has_many, via: criteria}
  - {from: Play, to: Audience, type: has_one, via: trigger_audience}
  - {from: Play, to: Persona, type: has_many, via: personas}
  - {from: Play, to: RoutingQueue, type: has_one, via: routing}
