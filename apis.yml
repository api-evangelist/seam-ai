name: Seam AI
description: 'Seam AI (legal entity Talkmore Inc.) is an AI-native account-based marketing (ABM) platform
  that uses AI agents to score accounts against an ICP, monitor first- and third-party buying signals,
  prospect and enrich contacts, and execute multi-channel outbound plays into Salesforce, HubSpot,
  Outreach, Salesloft, Marketo, LinkedIn Ads and the customer data warehouse. Backed by Bessemer Venture
  Partners, the company has been acquired and is merging its product into Clarify as "Clarify Signals";
  the getseam.ai marketing site now serves an acquisition notice. The developer surface remains live at
  docs.getseam.ai, which publishes an OpenAPI 3.1.0 contract for the Seam AI Enrichment API, an llms.txt
  index, an anonymous Model Context Protocol server, an A2A agent card, and a provider-authored Agent
  Skill. The API host named in that spec (enricher.getseam.ai) no longer resolves in DNS.'
