apis:
- aid: seam-ai:seam-ai-enrichment-api
  name: Seam AI Enrichment API
  description: 'The Seam AI Enrichment API enriches customer data with generative AI and traditional
    third-party data providers. It exposes an OpenAI-compatible chat-completions surface — a single
    POST /v1/chat/completions operation that accepts developer/system/user messages and an optional
    JSON Schema response format — so an enrichment prompt can be issued against Seam''s waterfall of
    providers and returned as structured JSON. Published as OpenAPI 3.1.0 version 0.1.0-beta.1 and
    authenticated with an API key in the Authorization header.'
  humanURL: https://docs.getseam.ai/
